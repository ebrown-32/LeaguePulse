name: Live game-day coverage

# Pokes the AI desk while NFL games are on, so it can post at kickoff and react
# to the scoreboard as it moves.
#
# This does not live in vercel.json because Vercel's Hobby plan allows two cron
# jobs and runs them once a day, which is the right shape for the daily batch
# and useless for live coverage. GitHub Actions runs this for free on a real
# schedule instead.
#
# The endpoint decides whether to do anything. It checks, in order: that Sleeper
# says we are in the regular or postseason, that an NFL window is currently open
# in Eastern time, that its own cooldown has elapsed, and that somebody has
# actually scored. Any tick that fails a gate returns "skipped" and costs
# nothing, so an over-generous schedule here is harmless.

on:
  schedule:
    # Times are UTC. Eastern is UTC-4 in season and UTC-5 from November, so each
    # window is widened by an hour at both ends rather than split in two; the
    # endpoint rejects the ticks that fall outside the real window.
    #
    # Sunday, 1pm ET onward.
    - cron: '*/30 16-23 * * 0'
    # Sunday night football running past midnight UTC into Monday.
    - cron: '*/30 0-5 * * 1'
    # Thursday night football (Friday in UTC).
    - cron: '*/30 0-5 * * 5'
    # Monday night football (Tuesday in UTC).
    - cron: '*/30 0-5 * * 2'
    # Saturday games, which appear from week 15.
    - cron: '*/30 17-23 * * 6'
  # So you can test it without waiting for a Sunday.
  workflow_dispatch:

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: Poke each site
        env:
          # Repository secrets. SITE_URL is the exact origin that serves your
          # own league, e.g. https://www.yourleague.com, not a domain that
          # redirects to it. CRON_SECRET must match that Vercel project's.
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Optional: the hosted product, a separate Vercel project. Its bare
          # domain, e.g. https://leaguepulse.io, which fans out to every live
          # league. Leave both unset if you only run your own league.
          HOSTED_SITE_URL: ${{ secrets.HOSTED_SITE_URL }}
          HOSTED_CRON_SECRET: ${{ secrets.HOSTED_CRON_SECRET }}
        run: |
          # Anything but a 200 fails the run. curl's own --fail only catches
          # 4xx and 5xx, so a redirect once passed as success: with SITE_URL
          # set to the bare domain, every run went green for weeks while the
          # site answered "307, go to www" and nothing was ever written.
          # --max-time generously above the function's own 60s ceiling.
          poke() {
            code=$(curl --silent --show-error --max-time 90 \
              --output response.txt --write-out '%{http_code}' \
              --header "Authorization: Bearer $2" \
              "$1/api/ai/cron?mode=live")
            echo "== $1 -> $code"; cat response.txt; echo
            if [ "$code" != "200" ]; then
              echo "::error::Expected 200 from $1, got $code. A 3xx means the URL is not the final address; set it to the URL the redirect points to."
              return 1
            fi
          }

          failed=0; ran=0
          if [ -n "$SITE_URL" ] && [ -n "$CRON_SECRET" ]; then
            ran=1; poke "$SITE_URL" "$CRON_SECRET" || failed=1
          fi
          if [ -n "$HOSTED_SITE_URL" ] && [ -n "$HOSTED_CRON_SECRET" ]; then
            ran=1; poke "$HOSTED_SITE_URL" "$HOSTED_CRON_SECRET" || failed=1
          fi
          if [ "$ran" = 0 ]; then
            echo "::error::Set SITE_URL and CRON_SECRET, or HOSTED_SITE_URL and HOSTED_CRON_SECRET, as repository secrets."
            exit 1
          fi
          exit $failed
