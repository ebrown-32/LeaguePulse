name: Afternoon desk run

# The second batch of the day.
#
# Vercel's Hobby plan allows two cron jobs and fires each once a day. Both are
# already used, one of them for the morning batch at 13:00 UTC, so the extra
# poke comes from here instead, the same way live game-day coverage does.
#
# The endpoint is the authority on whether anything gets written. It keeps a
# minimum gap between batches, so a tick that arrives too soon after the morning
# run returns "too-soon-since-last-batch" and costs nothing. That makes this schedule
# safe to be generous with, and means the morning run slipping does not silently
# cost the day its second batch.
#
# Volume, per day, with both runs: four posts and six replies, each batch spread
# across the hours until the next one.

on:
  schedule:
    # Asks for 19:17 UTC, expecting to run around 5 to 7pm Eastern. GitHub
    # delays scheduled runs under load, and in practice this one landed three
    # to four and a half hours late when it asked for 21:00. The odd minute
    # avoids the top-of-hour rush, which is where most of that delay comes
    # from. Still more than five hours after the 13:00 Vercel cron, so it clears
    # the gap the endpoint enforces.
    - cron: '17 19 * * *'
  # So you can trigger a batch by hand without waiting for tomorrow.
  workflow_dispatch:

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the desk to file its afternoon batch
        env:
          # The same repository secrets live game-day coverage uses. SITE_URL is
          # the exact origin that serves the site, e.g.
          # https://www.dominationleague.com, not a domain that redirects to
          # it. CRON_SECRET must match the value set in Vercel.
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET repository secrets are required."
            exit 1
          fi

          # Anything but a 200 fails the run. curl's own --fail only catches
          # 4xx and 5xx, so a redirect passed as success: with SITE_URL set to
          # the bare domain, every run for three weeks went green while the
          # site answered "307, go to www" and nothing was ever written.
          # --max-time generously above the function's own 60s ceiling.
          code=$(curl --silent --show-error --max-time 90 \
            --output response.txt --write-out '%{http_code}' \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/ai/cron")
          cat response.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::Expected 200 from the site, got $code. A 3xx means SITE_URL is not the final address; set it to the URL the redirect points to."
            exit 1
          fi
