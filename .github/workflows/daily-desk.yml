name: Desk runs

# Pokes the AI desk through the day so the feed keeps moving.
#
# Vercel's Hobby plan allows two cron jobs and fires each once a day. Both are
# already used, one of them for the 9am batch, so every other run is poked from
# here instead, the same way live game-day coverage is.
#
# The endpoint is the authority on whether anything gets written, not this
# schedule. It writes a batch only when the last one is at least two and a half
# hours old and it is not quiet hours (11pm to 8am Eastern), so these hourly
# pokes produce a run roughly every three hours: about 9am, noon, 3pm, 6pm and
# 9pm Eastern. A poke that comes too soon returns "skipped" and costs nothing.
#
# Hourly rather than every three hours on purpose. GitHub delays scheduled runs
# under load, by three to four and a half hours at worst so far, and a sparse
# schedule loses whole runs to that. With a poke every hour, a late one is
# simply covered by the next.
#
# Volume per day with the defaults: around ten posts and fifteen replies, each
# batch spread across the hours until the next one.

on:
  schedule:
    # Hourly at :17, 12:17 to 03:17 UTC, which covers 8am to 11pm Eastern in
    # both daylight and standard time. The odd minute avoids the top-of-hour
    # rush, which is where most of GitHub's delay comes from.
    - cron: '17 12-23 * * *'
    - cron: '17 0-3 * * *'
  # So you can trigger a batch by hand.
  workflow_dispatch:

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: Poke each site
        env:
          # Repository secrets. SITE_URL is the exact origin that serves your
          # own league, e.g. https://www.yourleague.com, not a domain that
          # redirects to it. CRON_SECRET must match that Vercel project's.
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Optional: the hosted product, a separate Vercel project. Its bare
          # domain, e.g. https://leaguepulse.io, which fans out to every live
          # league. Leave both unset if you only run your own league.
          HOSTED_SITE_URL: ${{ secrets.HOSTED_SITE_URL }}
          HOSTED_CRON_SECRET: ${{ secrets.HOSTED_CRON_SECRET }}
        run: |
          # Anything but a 200 fails the run. curl's own --fail only catches
          # 4xx and 5xx, so a redirect once passed as success: with SITE_URL
          # set to the bare domain, every run went green for weeks while the
          # site answered "307, go to www" and nothing was ever written.
          # --max-time generously above the function's own 60s ceiling.
          poke() {
            code=$(curl --silent --show-error --max-time 90 \
              --output response.txt --write-out '%{http_code}' \
              --header "Authorization: Bearer $2" \
              "$1/api/ai/cron")
            echo "== $1 -> $code"; cat response.txt; echo
            if [ "$code" != "200" ]; then
              echo "::error::Expected 200 from $1, got $code. A 3xx means the URL is not the final address; set it to the URL the redirect points to."
              return 1
            fi
          }

          failed=0; ran=0
          if [ -n "$SITE_URL" ] && [ -n "$CRON_SECRET" ]; then
            ran=1; poke "$SITE_URL" "$CRON_SECRET" || failed=1
          fi
          if [ -n "$HOSTED_SITE_URL" ] && [ -n "$HOSTED_CRON_SECRET" ]; then
            ran=1; poke "$HOSTED_SITE_URL" "$HOSTED_CRON_SECRET" || failed=1
          fi
          if [ "$ran" = 0 ]; then
            echo "::error::Set SITE_URL and CRON_SECRET, or HOSTED_SITE_URL and HOSTED_CRON_SECRET, as repository secrets."
            exit 1
          fi
          exit $failed
